<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Admin — TalentBridge AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .admin { max-width: 1100px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: #fff; }
      .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
      .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin: 16px 0; }
      .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
      .stat .n { font-size: 26px; font-weight: 700; }
      .stat .l { color: var(--muted); font-size: 13px; }
      .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef3ff; color: var(--brand-dark); }
      .token-row { display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap: wrap; }
      .token-row input { padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; min-width:260px; }
    </style>
  </head>
  <body>
    <main id="app" class="app admin">
      <div class="card">
        <h1>Study admin</h1>
        <p class="muted">Enter your admin token to view participants and export data.</p>
        <div class="token-row">
          <input type="password" id="token" placeholder="Admin token" />
          <button class="btn-primary" id="load">Load</button>
          <a id="export" class="btn-ghost" href="#" target="_blank">Download CSV</a>
        </div>
        <div id="status" class="muted small"></div>
        <div id="stats"></div>
        <div id="breakdown"></div>
        <div class="table-wrap"><table id="tbl"></table></div>
      </div>
    </main>
    <script src="/js/admin.js"></script>
  </body>
</html>
