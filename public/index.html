<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TalentBridge AI — Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="progress-bar"><div id="progress-fill"></div></div>

    <!-- Gamified "journey map" of the steps -->
    <nav id="journey" class="journey" aria-label="Your progress"></nav>

    <main id="app" class="app">
      <div class="loading">Loading…</div>
    </main>

    <!-- Friendly robot mascot "Bridge" that guides the participant -->
    <div id="mascot" class="mascot hidden">
      <div class="mascot-avatar" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="52" height="52">
          <rect x="14" y="20" width="36" height="30" rx="9" fill="#5b4bff"/>
          <rect x="18" y="26" width="28" height="16" rx="6" fill="#eef0ff"/>
          <circle cx="27" cy="34" r="3.2" fill="#5b4bff"/>
          <circle cx="37" cy="34" r="3.2" fill="#5b4bff"/>
          <rect x="29" y="10" width="6" height="8" rx="3" fill="#ff7a59"/>
          <circle cx="32" cy="9" r="3.5" fill="#ff7a59"/>
          <rect x="9" y="30" width="5" height="12" rx="2.5" fill="#3f2fd6"/>
          <rect x="50" y="30" width="5" height="12" rx="2.5" fill="#3f2fd6"/>
          <rect x="24" y="47" width="16" height="4" rx="2" fill="#3f2fd6"/>
        </svg>
      </div>
      <div class="mascot-bubble" id="mascot-bubble">Hi! I'm Bridge 🤖</div>
    </div>

    <!-- Persistent support widget (shown only when the support condition is ON) -->
    <button id="support-btn" class="support-btn hidden" aria-label="Report a problem or give feedback">
      <span>?</span>
    </button>
    <div id="support-modal" class="modal hidden">
      <div class="modal-card">
        <h3 id="support-title">Report a problem or give feedback</h3>
        <p class="muted">Tell us if something went wrong or didn't feel right.</p>
        <textarea id="support-text" rows="4" placeholder="Describe the issue or share your feedback…"></textarea>
        <div class="modal-actions">
          <button class="btn-ghost" id="support-cancel">Cancel</button>
          <button class="btn-primary" id="support-send">Send</button>
        </div>
        <p id="support-confirm" class="confirm hidden"></p>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
